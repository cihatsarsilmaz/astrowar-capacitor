name: Deploy Firebase Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Firebase deployment configuration
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -eu
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "::error title=Missing Firebase credential::Add FIREBASE_TOKEN under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error title=Missing Firebase project ID::Add FIREBASE_PROJECT_ID under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Firebase deployment configuration is present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v14.0.0
        with:
          args: deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
