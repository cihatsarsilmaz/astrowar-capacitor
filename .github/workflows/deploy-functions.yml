name: Deploy Firebase Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Check Firebase deployment configuration
        id: firebase-config
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          missing=()
          if [ -z "${FIREBASE_TOKEN}" ]; then
            missing+=("FIREBASE_TOKEN secret")
          fi
          if [ -z "${FIREBASE_PROJECT_ID}" ]; then
            missing+=("FIREBASE_PROJECT_ID Actions variable")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf '::warning title=Firebase deployment skipped::Missing %s. Configure these in repository Settings > Secrets and variables > Actions.\n' "$(IFS=', '; echo "${missing[*]}")"
            {
              echo "## Firebase deployment skipped"
              echo
              printf 'Deployment was not attempted because the following configuration is missing: **%s**.\n' "$(IFS=', '; echo "${missing[*]}")"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.firebase-config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.firebase-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        if: steps.firebase-config.outputs.enabled == 'true'
        working-directory: functions
        run: npm install

      - name: Deploy to Firebase
        if: steps.firebase-config.outputs.enabled == 'true'
        uses: w9jds/firebase-action@v14.0.0
        with:
          args: deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
