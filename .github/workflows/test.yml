name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - run: npm test

  golge-autofix-tests:
    name: GOLGE AI autofix regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run autofix unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_autofix.py' -v
      - name: Run merge safety simulation regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_merge_safety.py' -v
      - name: Run merge-deploy isolation regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_merge_deploy_isolation.py' -v
      - name: Run integrated merge safety regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_merge_integrated.py' -v
      - name: Run read-only GitHub merge evidence adapter tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_merge_evidence.py' -v
      - name: Run GOLGE AI operation ledger regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_operation_ledger.py' -v
      - name: Run authenticated GOLGE AI GitHub collector tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_github_collector.py' -v
      - name: Run GOLGE AI GitHub REST transport tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_github_readonly_client.py' -v
      - name: Run GOLGE AI operation timer tests
        run: python -m unittest discover -s scripts/tests -p 'test_golge_ai_operation_timer.py' -v
