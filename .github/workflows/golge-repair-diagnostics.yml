name: GOLGE AI Repair Diagnostics (read-only)
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/golge-repair-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golge-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run isolated checks and collect evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/golge-evidence
          failures=0
          run_check() {
            local name="$1"
            shift
            echo "::group::$name"
            "$@" > "/tmp/golge-evidence/$name.log" 2>&1
            local rc=$?
            cat "/tmp/golge-evidence/$name.log"
            echo "::endgroup::"
            printf '%s=%s\n' "$name" "$rc" >> /tmp/golge-evidence/status.txt
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check install npm ci --no-audit --no-fund
          if grep -q '^install=0$' /tmp/golge-evidence/status.txt; then
            run_check test npm test
            run_check build npm run build
          else
            printf 'test=skipped\nbuild=skipped\n' >> /tmp/golge-evidence/status.txt
          fi
          {
            echo '## GOLGE AI — AstroWar diagnostics'
            echo '### Reproducible checks'
            echo '```text'
            cat /tmp/golge-evidence/status.txt
            echo '```'
            echo '### First failure evidence (truncated)'
            first="$(grep -v '=0$' /tmp/golge-evidence/status.txt | grep -v '=skipped$' | head -1 | cut -d= -f1 || true)"
            if [ -n "$first" ]; then
              echo "`$first` failed; inspect the associated job log."
              echo '```text'
              tail -n 35 "/tmp/golge-evidence/$first.log" | sed -E 's/([A-Za-z0-9_]*(TOKEN|PASSWORD|SECRET|KEY)[A-Za-z0-9_]*=)[^ ]+/\1[REDACTED]/Ig'
              echo '```'
            else
              echo 'All executed checks passed.'
            fi
            echo 'No files were modified or pushed; no merge or deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Classify failure and propose controlled repair
        if: always()
        shell: bash
        run: |
          echo '## GOLGE AI — Controlled repair proposal' >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f /tmp/golge-evidence/status.txt ]; then
            echo 'Diagnostics did not produce a status file; inspect runner/setup errors before proposing a fix.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed="$(grep -E '^[a-z]+=([1-9][0-9]*)$' /tmp/golge-evidence/status.txt | head -1 | cut -d= -f1 || true)"
          if [ -z "$failed" ]; then
            echo 'No failing command found. Do not create an unnecessary repair PR.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "First failed check: $failed" >> "$GITHUB_STEP_SUMMARY"
          case "$failed" in
            install)
              echo 'Check package.json/package-lock.json consistency and Node compatibility. Reproduce with npm ci before proposing any lockfile change.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            test)
              echo 'Identify the first failing Vitest assertion and its source. Limit changes to related source/tests; rerun npm test and build.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            build)
              echo 'Identify the first Vite compilation error. Limit changes to implicated files; rerun npm test and build.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo 'Unclassified failure: require manual review before changes.' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          echo 'This is advice only: no automatic code writes, PR creation, merge, deployment, or Firebase production changes.' >> "$GITHUB_STEP_SUMMARY"
