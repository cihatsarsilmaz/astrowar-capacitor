name: AstroWar Evolution isolated browser and build (no deploy)
on:
  pull_request:
    paths:
      - 'src/arena/evolution/**'
      - 'evolution.html'
      - 'scripts/evolution-browser-smoke.mjs'
      - '.github/workflows/evolution-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - name: Install browser test runtime (not committed)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium for test
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium browser smoke
        run: node scripts/evolution-browser-smoke.mjs
