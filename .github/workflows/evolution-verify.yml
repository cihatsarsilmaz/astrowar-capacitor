name: AstroWar Evolution isolated browser and build (no deploy)
on:
  pull_request:
    paths:
      - 'src/arena/evolution/**'
      - 'evolution.html'
      - 'vite.evolution.config.js'
      - 'scripts/evolution-browser-smoke.mjs'
      - '.github/workflows/evolution-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - run: npx vite build --config vite.evolution.config.js
      - name: Install browser test runtime in isolated temporary prefix
        run: |
          npm install --prefix "$RUNNER_TEMP/evo-playwright" --ignore-scripts --no-save playwright@1.56.1
          ln -s "$RUNNER_TEMP/evo-playwright/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/evo-playwright/node_modules/playwright-core" node_modules/playwright-core
      - name: Install Chromium for test
        run: "$RUNNER_TEMP/evo-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run real Chromium browser smoke
        run: node scripts/evolution-browser-smoke.mjs
