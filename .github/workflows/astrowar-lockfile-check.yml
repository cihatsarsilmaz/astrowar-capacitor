name: AstroWar Lockfile Repair Artifact

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/astrowar-lockfile-check.yml
  push:
    branches:
      - dependabot/npm_and_yarn/capacitor/android-8.6.0
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/astrowar-lockfile-check.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check package compatibility
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile on exact repair branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dependabot/npm_and_yarn/capacitor/android-8.6.0'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix: regenerate Capacitor 8 lockfile'
          git push origin HEAD:refs/heads/dependabot/npm_and_yarn/capacitor/android-8.6.0
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-lockfile-${{ github.run_id }}
          path: package-lock.json
          retention-days: 3
