name: GOLGE AI Safe Auto Continue Queue

# Runs only after the trusted main-branch test workflow completes.
# It does NOT execute workflow_run head code, merge, deploy, or apply fixes.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: golge-safe-queue-single-writer
  cancel-in-progress: false

jobs:
  queue-next-reviewed-task:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate trusted workflow run and queue one allowlisted task
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            if (!run || run.name !== 'test' ||
                run.conclusion !== 'success' || run.event !== 'push' ||
                run.head_branch !== 'main' ||
                run.head_repository?.full_name !== repo.owner + '/' + repo.repo) {
              core.setFailed('Untrusted or unsuccessful source run');
              return;
            }
            // Only a reviewed static task may be queued. No model-generated
            // instructions, code checkout, secret access, or automatic writes.
            const taskId = 'review-issues-ledger-integration-v1';
            const marker = '<!-- golge-safe-task:' + taskId + ' -->';
            const title = '[GOLGE AI QUEUE] ' + taskId;
            const body = [
              marker,
              'Status: awaiting human review',
              'Task: Validate the GitHub Issues incident adapter integration',
              'Evidence: ' + run.html_url,
              'Source commit: ' + run.head_sha,
              'Allowed action: diagnostic review only',
              'Not authorized: merge, deployment, automatic code edits, paid operations',
              'This queue entry is not proof of a completed development task.'
            ].join('\n');
            // GitHub Issues are durable across runner restarts. Exhaust history
            // before any write; on API failure, fail closed.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'all', per_page: 100
            });
            if (existing.some(issue => !issue.pull_request &&
                (issue.body || '').includes(marker))) {
              core.info('Task already queued; no duplicate issue created.');
              return;
            }
            await github.rest.issues.create({ ...repo, title, body });
            core.info('Queued one reviewed diagnostic task; no execution triggered.');
