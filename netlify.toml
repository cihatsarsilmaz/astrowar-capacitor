[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "18"

# Tek sayfa uygulama: tüm route'ları index.html'e yönlendir
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Asset önbellekleme (Vite hash'li dosyalar sonsuza kadar güvenle önbelleğe alınır)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options         = "DENY"
