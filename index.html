<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020810" />
    <meta name="description" content="AstrogameWAR — uzay stratejisi ve filo savaşı oyunu" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>AstrogameWAR</title>
    <style>
      html, body, #root { margin:0; padding:0; width:100%; height:100%; background:#020810; overflow-x:hidden; }
      body { position:fixed; overscroll-behavior:none; -webkit-overflow-scrolling:touch; }
      #root { overflow-y:auto; height:100vh; }
      .astro-boot-error { box-sizing:border-box; min-height:100vh; padding:20px; background:#160b12; color:#ffe4e6; font:14px/1.5 system-ui,sans-serif; overflow-wrap:anywhere; }
      .astro-boot-error pre { white-space:pre-wrap; padding:12px; border-radius:8px; background:#2a101b; }
    </style>
    <script>
      (function () {
        function showBootError(title, detail) {
          var root = document.getElementById("root");
          if (!root) return;
          var panel = document.createElement("main");
          panel.className = "astro-boot-error";
          var heading = document.createElement("h1");
          heading.textContent = title;
          var explanation = document.createElement("p");
          explanation.textContent = "Hata ayrıntısını ekran görüntüsüyle paylaşabilirsin.";
          var details = document.createElement("pre");
          details.textContent = String(detail || "Ayrıntı alınamadı");
          var reload = document.createElement("button");
          reload.textContent = "Yeniden yükle";
          reload.style.cssText = "padding:10px 14px;border:0;border-radius:8px";
          reload.addEventListener("click", function () { window.location.reload(); });
          panel.appendChild(heading);
          panel.appendChild(explanation);
          panel.appendChild(details);
          panel.appendChild(reload);
          root.replaceChildren(panel);
        }
        window.addEventListener("error", function (event) {
          if (event.target && event.target.tagName === "SCRIPT") {
            showBootError("AstrogameWAR dosyası yüklenemedi", event.target.src || "Modül dosyası yüklenemedi");
          } else if (event.error || event.message) {
            showBootError("AstrogameWAR JavaScript hatası", (event.message || "Bilinmeyen hata") + (event.filename ? "\nDosya: " + event.filename : "") + (event.lineno ? "\nSatır: " + event.lineno : ""));
          }
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          showBootError("AstrogameWAR işlem hatası", reason && (reason.stack || reason.message) || reason || "Bilinmeyen Promise hatası");
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
